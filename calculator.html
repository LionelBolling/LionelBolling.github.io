<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #222;
        }

        h1,
        h2 {
            color: #fd8802;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #17365d;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eaf1f8;
        }

        .error {
            color: rgb(0, 0, 0);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Calculator Assignment</h1>
    <p>Enter two numbers and an arithmetic operator in the prompt boxes.</p>

    <script src="calculator.js"></script>
</body>
</html>
